    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="838" height="212" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="838" height="212" rx="14" fill="url(#bg)" stroke="#1c3358" stroke-width="1.5"/>
