<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Ishan Chakrabarti: local-first AI systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1533"/>
      <stop offset="55%" stop-color="#0a1229"/>
      <stop offset="100%" stop-color="#060c1c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26d0ce" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#26d0ce" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#26d0ce" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#26d0ce" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="838" height="218" rx="14"/></clipPath>
  </defs>

  <rect x="1" y="1" width="838" height="218" rx="14" fill="url(#bg)" stroke="#1c3358" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="840" height="220" fill="url(#grid)"/>
    <circle cx="120" cy="118" r="150" fill="#26d0ce" opacity="0.05"/>

    <!-- scanline -->
    <rect x="0" y="0" width="840" height="2" fill="url(#edge)" opacity="0.55">
      <animate attributeName="y" values="-4;222;-4" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- node cluster, echoes the avatar -->
    <g stroke="#26d0ce" stroke-width="1.1" opacity="0.55">
      <line x1="92" y1="112" x2="150" y2="72"/>
      <line x1="92" y1="112" x2="152" y2="156"/>
      <line x1="92" y1="112" x2="44" y2="88"/>
      <line x1="150" y1="72" x2="186" y2="110"/>
    </g>
    <g fill="#7ef9ff" filter="url(#glow)">
      <circle cx="92" cy="112" r="9"/>
      <circle cx="150" cy="72" r="5"/>
      <circle cx="152" cy="156" r="5.5"/>
      <circle cx="44" cy="88" r="3.5" opacity="0.7"/>
      <circle cx="186" cy="110" r="3.5" opacity="0.7"/>
    </g>
    <circle cx="92" cy="112" r="9" fill="none" stroke="#26d0ce" stroke-width="1.2" opacity="0.8">
      <animate attributeName="r" values="9;26;9" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#26d0ce" stroke-width="2" fill="none" opacity="0.85">
    <path d="M16 44V22a6 6 0 0 1 6-6h24"/>
    <path d="M794 16h24a6 6 0 0 1 6 6v22"/>
    <path d="M16 176v22a6 6 0 0 0 6 6h24"/>
    <path d="M824 176v22a6 6 0 0 1-6 6h-24"/>
  </g>

  <g font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">
    <text x="248" y="58" fill="#26d0ce" font-size="12.5" letter-spacing="3.6" opacity="0.85">LOCAL-FIRST AI SYSTEMS</text>
    <text x="248" y="96" fill="#eafcff" font-size="27" font-weight="700" letter-spacing="0.4">Ishan Chakrabarti</text>
    <line x1="248" y1="112" x2="792" y2="112" stroke="#26d0ce" stroke-opacity="0.22" stroke-width="1"/>

    <text x="248" y="140" fill="#8fb6d9" font-size="13.5">
      <tspan fill="#26d0ce">retrieval</tspan><tspan fill="#3c5a80">  ·  </tspan>hybrid BM25 + FAISS, cross-encoder reranking
    </text>
    <text x="248" y="164" fill="#8fb6d9" font-size="13.5">
      <tspan fill="#26d0ce">inference</tspan><tspan fill="#3c5a80">  ·  </tspan>on-device via Ollama, zero cloud APIs
    </text>
    <text x="248" y="188" fill="#8fb6d9" font-size="13.5">
      <tspan fill="#26d0ce">evaluation</tspan><tspan fill="#3c5a80">  ·  </tspan>citation enforcement, NLI verification
    </text>
  </g>

  <g>
    <circle cx="806" cy="196" r="3.5" fill="#26d0ce">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
